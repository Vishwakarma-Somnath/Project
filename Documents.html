<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <!-- Favicon -->
    <link href="images/name-logo04 copy.png" rel="icon">

    <title>My_Latest_Projects_Documents</title>

    <style>
        * {
            box-sizing: border-box;
        }

        html,
        body {
            margin: 0;
            padding: 0;
            min-height: 100%;
        }

        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: black;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            color: #fff;
            position: relative;
            overflow-x: hidden;
        }

        /* Heart animation canvas */
        #heart {
            position: fixed;
            top: 0;
            left: 0;
            width: 100vw;
            height: 100vh;
            z-index: 0;
            pointer-events: none;
        }
		#heart-name,
        #heart-name01,
        #heart-name02,
        #heart-name03 {
            position: fixed;
            transform: translateX(-50%);
            z-index: 11;
            pointer-events: none;

            font-family: "Algerian", serif;
            font-size: 32px;
            font-weight: bold;

        /* Animation */
            animation:
        nameFloat 3s ease-in-out infinite,
        nameGlow 1.8s ease-in-out infinite alternate;

    white-space: nowrap;
    }

/* ------------------------------
   SOMNATH
   ------------------------------ */

#heart-name01 {
    left: 35%;
    top: 20%;
    color: #ffffff;

    animation-delay: 0s;

    text-shadow:
        0 0 5px red,
        0 0 10px red,
        0 0 15px red,
        0 0 25px red;
}

/* ------------------------------
   VISHWAKARMA_01
   ------------------------------ */

#heart-name02 {
    left: 65%;
    top: 20%;
    color: #ffffff;

    animation-delay: 0.5s;

    text-shadow:
        0 0 5px #5fd6ee,
        0 0 10px #5fd6ee,
        0 0 15px #5fd6ee,
        0 0 25px #5fd6ee;
}

/* ------------------------------
   ROHIT
   ------------------------------ */

#heart-name {
    left: 35%;
    top: 83%;
    color: #23f3f0;

    animation-delay: 1s;

    text-shadow:
        0 0 5px red,
        0 0 10px red,
        0 0 15px red,
        0 0 25px red;
}

/* ------------------------------
   VISHWAKARMA_2
   ------------------------------ */

#heart-name03 {
    left: 65%;
    top: 83%;
    color: #fef603;

    animation-delay: 1.5s;

    text-shadow:
        0 0 5px #ff5e00,
        0 0 10px #ff5e00,
        0 0 15px #ff5e00,
        0 0 25px #ff5e00;
}


/* ==============================
   FLOATING ANIMATION
   ============================== */

@keyframes nameFloat {

    0% {
        transform: translate(-50%, 0px) rotate(0deg);
    }

    25% {
        transform: translate(-50%, -8px) rotate(-1deg);
    }

    50% {
        transform: translate(-50%, -15px) rotate(0deg);
    }

    75% {
        transform: translate(-50%, -8px) rotate(1deg);
    }

    100% {
        transform: translate(-50%, 0px) rotate(0deg);
    }
}


/* ==============================
   GLOW / PULSE ANIMATION
   ============================== */

@keyframes nameGlow {

    0% {
        opacity: 0.75;
        letter-spacing: 1px;
        filter: brightness(0.9);
    }

    50% {
        opacity: 1;
        letter-spacing: 3px;
        filter: brightness(1.4);
    }

    100% {
        opacity: 0.85;
        letter-spacing: 1px;
        filter: brightness(1);
    }
}

        .container {
            width: 90%;
            max-width: 1800px;
            text-align: center;
            background: transparent;
            padding: 40px;
            border-radius: 20px;
            backdrop-filter: none;
            box-shadow: 0 8px 20px rgba(0, 0, 0, 0.3);

            /* Keep content above canvas */
            position: relative;
            z-index: 1;
        }

        .algerian-title {
    font-family: "Algerian", serif;
    font-size: 50px;
    font-weight: normal;
    margin-bottom: 30px;

    background: linear-gradient(
        90deg,
        #ff0000,
        #ffff00,
        #00ffff,
        #00ff00,
        #ff00ff,
        #ff0000
    );

    background-size: 400% 100%;

    -webkit-background-clip: text;
    -webkit-text-fill-color: transparent;
    background-clip: text;

    animation:
        titleColor 5s linear infinite,
        titleFloat 3s ease-in-out infinite;

    text-shadow: none;
    letter-spacing: 3px;
}

@keyframes titleColor {
    0% {
        background-position: 0% 50%;
    }

    50% {
        background-position: 100% 50%;
    }

    100% {
        background-position: 0% 50%;
    }
}

@keyframes titleFloat {
    0%,
    100% {
        transform: translateY(0px);
    }

    50% {
        transform: translateY(-8px);
    }
}

        .buttons {
            display: grid;
            grid-template-columns: repeat(3, minmax(220px, 1fr));
            gap: 20px;
			
        }

        .folder-btn {
            padding: 20px;
            border: none;
            border-radius: 12px;
            background: linear-gradient(135deg, #2563eb, #1d4ed8);
            color: #fff;
            font-size: 16px;
            font-weight: bold;
            cursor: pointer;
            text-decoration: none;
            transition: all 0.3s ease;
            display: flex;
            align-items: center;
            justify-content: center;
            box-shadow: 0 6px 12px rgba(0, 0, 0, 0.2);
        }

        .folder-btn:hover {
            background: linear-gradient(135deg, #d81dcc, #a21caf);
            transform: translateY(-5px) scale(1.05);
            box-shadow: 0 10px 18px rgba(0, 0, 0, 0.3);
        }

        .folder-btn:active {
            transform: scale(0.97);
        }

        @media (max-width: 900px) {
            .buttons {
                grid-template-columns: repeat(2, minmax(220px, 1fr));
            }
        }

        @media (max-width: 500px) {
            .buttons {
                grid-template-columns: 1fr;
            }

            .algerian-title {
                font-size: 28px;
            }

            .container {
                padding: 25px;
            }
        }
            /* =========================================
               MOBILE MODE - HIDE NAMES
             ========================================= */

            @media (max-width: 768px) {
                #heart-name,
                #heart-name01,
                #heart-name02,
                #heart-name03 {
                    display: none !important;
                }
            }
      
            .folder-btn {
                font-family: inherit;
                width: 100%;
            }

            #plantLocationsSection[hidden] {
                display: none !important;
            }

            #plantLocationsStatus {
                color: #5fd6ee;
                overflow-wrap: anywhere;
            }

            #plantLocationButtons {
                margin-top: 20px;
            }

    </style>
</head>

<body>

    <!-- Animated Heart Canvas -->
    <canvas id="heart"></canvas>
	<div id="heart-name01">Somnath</div>
	<div id="heart-name02">Vishwakarma</div>
	<div id="heart-name">Rohit</div>
	<div id="heart-name03">Vishwakarma</div>

    <div class="container" role="main" aria-label="Project Documents">

        <h1 class="algerian-title">
            📂 My Latest Projects Documents
        </h1>

                
    <div class="buttons">
        <a class="folder-btn"
            href="Projects/plant-access.html?company=BPCL">
            🏢BPCL — Project Documents
        </a>

        <a class="folder-btn"
            href="Projects/plant-access.html?company=HPCL">
            🏢HPCL — Project Documents
        </a>

        <a class="folder-btn"
            href="Projects/plant-access.html?company=IOCL">
            🏢IOCL — Project Documents
        </a>

        <a class="back" id="backLink" href="./index.html">← Back</a>

    </div>

</div>

    <script>
    (() => {
        const SUPABASE_URL =
            "https://ypxffgqjrckojzzldczm.supabase.co";

        // Apne current Supabase publishable/anon key ka use karein.
        const SUPABASE_PUBLIC_KEY =
            "PASTE_YOUR_SUPABASE_PUBLISHABLE_KEY_HERE";

        // Is path ko apni actual plant-access.html location ke mutabik set karein.
        const PLANT_ACCESS_PAGE = "Projects/plant-access.html";

        const section = document.getElementById("plantLocationsSection");
        const title = document.getElementById("plantLocationsTitle");
        const status = document.getElementById("plantLocationsStatus");
        const list = document.getElementById("plantLocationButtons");

        if (!section || !title || !status || !list) return;

        async function loadPlants(company) {
            section.hidden = false;
            title.textContent = company + " — Select Plant / Location";
            status.textContent = "Loading locations...";
            list.replaceChildren();

            try {
                const response = await fetch(
                    SUPABASE_URL + "/functions/v1/list-public-plants",
                    {
                        method: "POST",
                        headers: {
                            "Content-Type": "application/json",
                            "apikey": SUPABASE_PUBLIC_KEY,
                            "Authorization": "Bearer " + SUPABASE_PUBLIC_KEY
                        },
                        body: JSON.stringify({ company })
                    }
                );

                const result = await response.json();

                if (!response.ok || result.success !== true) {
                    throw new Error(result.error || "Could not load locations.");
                }

                const plants = Array.isArray(result.plants)
                    ? result.plants
                    : [];

                if (plants.length === 0) {
                    status.textContent =
                        "No active locations found for " + company + ".";
                    return;
                }

                plants.forEach((plant) => {
                    if (
                        plant.company !== company ||
                        !plant.location_name ||
                        !plant.location_slug
                    ) {
                        return;
                    }

                    const button = document.createElement("a");
                    button.className = "folder-btn";
                    button.href =
                        PLANT_ACCESS_PAGE +
                        "?company=" + encodeURIComponent(plant.company) +
                        "&plant=" + encodeURIComponent(plant.location_slug);

                    button.textContent = "📍 " + plant.location_name;
                    button.setAttribute(
                        "aria-label",
                        "Open " + plant.location_name + " plant login"
                    );

                    list.appendChild(button);
                });

                status.textContent = list.children.length
                    ? "Select your plant / location."
                    : "No valid locations are available.";
            } catch (error) {
                console.error("Plant location loading failed:", error);
                status.textContent =
                    "Locations could not be loaded. Please try again later.";
            }
        }

        document.querySelectorAll("[data-company]").forEach((button) => {
            button.addEventListener("click", () => {
                const company = button.dataset.company;
                if (["BPCL", "HPCL", "IOCL"].includes(company)) {
                    loadPlants(company);
                }
            });
        });
    })();
    </script>

    <!-- JavaScript -->
    <script src="heart.js"></script>

</body>
</html>
