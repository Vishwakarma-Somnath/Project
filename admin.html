
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <link href="images/name-logo04 copy.png" rel="icon">
    <title>Admin Panel | Feedback Management</title>

    <link href="https://unpkg.com/boxicons@2.1.4/css/boxicons.min.css" rel="stylesheet">

    <style>
        /* =====================================
           1. GLOBAL STYLES
        ===================================== */

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: Algerian, sans-serif;
        }

        html,
        body {
            width: 100%;
            min-height: 100%;
        }

        body{
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            background: #25252b;
        }

        [hidden] {
            display: none !important;
        }


        /* =====================================
           2. LOGIN CONTAINER
        ===================================== */

        #loginSection {
            position: relative;
            width: 850px;
            max-width: calc(100% - 32px);
            height: 450px;
            margin: 45px auto;
            border: 2px solid #e46033;
            border-radius: 12px;
            box-shadow: 0 0 25px #e46033;
            overflow: hidden;
        }

        .curved-shape {
            position: absolute;
            top: -5px;
            right: 0;
            width: 850px;
            height: 600px;
            background: linear-gradient(45deg, #000000, #e46033);
            transform: rotate(10deg) skewY(40deg);
            transform-origin: bottom right;
            animation: curvedShapeEntry 1.5s ease-out forwards;
            z-index: 1;
        }

        .curved-shape3 {
            position: absolute;
            top: -5px;
            left: 0;
            width: 850px;
            height: 600px;
            background: linear-gradient(135deg, #000000, #f5ff3a);
            transform: rotate(0deg) skewY(-40deg);
            transform-origin: bottom right;
            animation: curvedShape3Entry 1.5s ease-out forwards;
            z-index: 0;
        }

        .curved-shape2 {
            position: absolute;
            top: 100%;
            left: 250px;
            width: 850px;
            height: 700px;
            background: #000000;
            border-top: 3px solid #e46033;
            transform-origin: bottom left;
            z-index: 1;
        }

        @keyframes curvedShapeEntry {
            from {
                opacity: 0;
                transform: translateX(100px) rotate(10deg) skewY(40deg);
            }
            to {
                opacity: 1;
                transform: translateX(0) rotate(10deg) skewY(40deg);
            }
        }

        @keyframes curvedShape3Entry {
            from {
                opacity: 0;
                transform: translateX(-100px) skewY(-40deg);
            }
            to {
                opacity: 1;
                transform: translateX(0) skewY(-40deg);
            }
        }


        /* =====================================
           3. LOGIN FORM
        ===================================== */

        .form-box {
            position: absolute;
            top: 0;
            left: 0;
            width: 50%;
            height: 105%;
            display: flex;
            flex-direction: column;
            justify-content: center;
            padding: 35px 40px;
            z-index: 2;
        }

        .form-box h2 {
            color: #fff;
            font-size: 38px;
            word-spacing: 5px;
            letter-spacing: 10px;
            text-align: center;
        }

        #loginForm {
            width: 100%;
        }

        .input-box {
            position: relative;
            width: 100%;
            height: 50px;
            margin: 25px 0;
        }

        .input-box input {
            width: 100%;
            height: 100%;
            padding-right: 35px;
            background: transparent;
            border: none;
            outline: none;
            border-bottom: 2px solid #fff;
            color: #fff;
            font-size: 16px;
        }

        .input-box input:focus,
        .input-box input:valid {
            border-bottom-color: #e46033;
        }

        .input-box label {
            position: absolute;
            top: 50%;
            left: 0;
            transform: translateY(-50%);
            color: #c9d5df;
            font-size: 15px;
            pointer-events: none;
            transition: 0.3s;
        }

        .input-box input:focus ~ label,
        .input-box input:valid ~ label {
            top: -5px;
            color: #e46033;
            font-size: 12px;
        }

        .input-box i {
            position: absolute;
            top: 50%;
            right: 0;
            transform: translateY(-50%);
            color: #c9d5df;
            font-size: 20px;
        }

        #adminEmail,
        #adminPassword {
            color: #fff !important;
            background-color: transparent !important;
            caret-color: #e46033;
            -webkit-text-fill-color: #fff !important;
        }

        #adminEmail:-webkit-autofill,
        #adminPassword:-webkit-autofill,
        #adminEmail:-webkit-autofill:hover,
        #adminPassword:-webkit-autofill:hover,
        #adminEmail:-webkit-autofill:focus,
        #adminPassword:-webkit-autofill:focus {
            -webkit-text-fill-color: #fff !important;
            -webkit-box-shadow: 0 0 0 1000px #25252b inset !important;
            caret-color: #e46033;
            transition: background-color 9999s ease-in-out 0s;
        }

        #adminEmail::selection,
        #adminPassword::selection {
            background: #e46033;
            color: #fff;
        }


        /* =====================================
           4. LOGIN BUTTON
        ===================================== */

        .btn {
            position: relative;
            width: 100%;
            height: 45px;
            overflow: hidden;
            isolation: isolate;
            border: 2px solid #e46033;
            border-radius: 40px;
            background: transparent;
            color: #c0c0c0;
            font-size: 25px;
            letter-spacing: 5px;
            text-transform: uppercase;
            cursor: pointer;
        }

        .btn::before {
            content: "";
            position: absolute;
            inset: 0;
            height: 300%;
            background: linear-gradient(
                #25252b,
                #e46033,
                #25252b,
                #e46033
            );
            transform: translateY(-66.67%);
            transition: transform 0.5s ease;
            z-index: -1;
        }

        .btn:hover::before {
            transform: translateY(0);
        }

        .btn:focus-visible {
            outline: 2px solid #fff;
            outline-offset: 4px;
        }

        .forgot-btn {
            display: block;
            margin: 15px auto 0;
            padding: 8px;
            background: transparent;
            border: none;
            color: #55c8ef;
            font-size: 20px;
            letter-spacing: 1px;
            cursor: pointer;
            animation: fadeIn 0.8s ease 1s forwards;
            opacity: 0;
        }

        .forgot-btn:hover {
            text-decoration: underline;
        }

        #loginStatus {
            margin-top: 10px;
            padding-left: 20px;
            color: #eef536;
            font-size: 13px;
            line-height: 1.5;
            overflow-wrap: anywhere;
            text-align: left;
        }


        /* =====================================
           5. WELCOME MESSAGE
        ===================================== */

        .info-content {
            position: absolute;
            top: 0;
            right: 0;
            width: 70%;
            height: 30%;
            display: flex;
            flex-direction: column;
            justify-content: center;
            padding: 35px;
            text-align: right;
            z-index: 2;
        }

        .info-content h2 {
            color: #fff;
            font-size: 44px;
            word-spacing: 1px;
            letter-spacing: 2px;
            line-height: 1.3;
            text-transform: uppercase;
        }

        .info-content02 {
            position: absolute;
            top: 10%;
            right: 0;
            width: 35%;
            height: 70%;
            display: flex;
            flex-direction: column;
            justify-content: center;
            padding: 35px;
            text-align: right;
            z-index: 2;
        }

        .info-content02 p {
            margin-top: 16px;
            color: #fff;
            font-size: 15px;
            line-height: 1.7;
        }

        .animation {
            opacity: 0;
            animation: fadeIn 0.8s ease forwards;
        }

        .form-box h2.animation {
            animation-delay: 0.2s;
        }

        .form-box .input-box:nth-of-type(1) {
            animation-delay: 0.4s;
        }

        .form-box .input-box:nth-of-type(2) {
            animation-delay: 0.6s;
        }

        .form-box .input-box:nth-of-type(3) {
            animation-delay: 0.8s;
        }

        @keyframes fadeIn {
            from {
                opacity: 0;
                transform: translateY(20px);
            }
            to {
                opacity: 1;
                transform: translateY(0);
            }
        }


        /* =====================================
           6. DASHBOARD - FIXED VIEWPORT
           BACKGROUND + HEADER STAY IN PLACE
        ===================================== */

        #dashboard.admin-panel {
            position: fixed;
            inset: 0;
            width: 100%;
            height: 100vh;
            height: 100dvh;
            min-height: 0;
            display: flex;
            flex-direction: column;
            overflow: hidden;
            background-image: url("images/Wallpaper2.png");
            background-size: cover;
            background-position: center;
            background-repeat: no-repeat;
        }

        /* Header does not scroll */
            #dashboard .dashboard-fixed-header {
                flex: 0 0 auto;
                position: relative;
                z-index: 2;
            }

            /* This area must be allowed to shrink */
            #dashboard .dashboard-feedback-scroll {
                display: block;
                flex: 1 1 0;
                min-height: 0;
                height: 0;

                overflow-y: scroll;
                overflow-x: hidden;

                -webkit-overflow-scrolling: touch;
                overscroll-behavior-y: contain;
            }

            /* Let the records expand naturally */
            #dashboard #pendingList {
                display: grid;
                grid-template-columns: repeat(2, minmax(0, 1fr));
                gap: 20px;
                column-gap: 25px;  /* Left aur right cards ke beech gap */
                row-gap: 5px;    /* Upar aur neeche cards ke beech gap */
                width: 100%;
                align-items: start;
                min-height: 0;
            }

            /* Prevent cards from being clipped */
            #dashboard .admin-item {
                width: 100%;
                max-width: none;
                min-width: 0;
                margin: 0;
                padding: 0px;
                box-sizing: border-box;
                background: #fff;
                color: #222;
                border-radius: 15px;
                box-shadow: 0 3px 12px rgba(0, 0, 0, 0.15);
                overflow-wrap: anywhere;
            }

        /* Header never scrolls with the cards */
        #dashboard .dashboard-fixed-header {
            position: relative;
            z-index: 2;

            flex: 0 0 auto;
            width: 100%;
            padding: 24px 30px 12px;

            background: transparent;
        }

        #dashboard h1 {
            margin: 0 0 18px;
            color: #fff;
            font-size: 30px;
            align-items: center;
            overflow-wrap: anywhere;
        }

        #dashboard h2 {
            margin: 20px 0 12px;
            color: #fff;
            font-size: 23px;
            word-spacing: 5px;
            letter-spacing: 8px;
            overflow-wrap: anywhere;
        }

        #logoutBtn {
            display: inline-block;
            padding: 10px 18px;
            border: none;
            border-radius: 6px;
            background: #b42318;
            color: #fff;
            cursor: pointer;
        }

        #logoutBtn:hover {
            background: #8f1b13;
        }

        #adminStatus {
            margin: 12px 0 0;
            color: #f5e12e !important;
            line-height: 1.5;
            overflow-wrap: anywhere;
        }


        /* =====================================
           7. ONLY FEEDBACK CARDS SCROLL
        ===================================== */

        #dashboard .dashboard-feedback-scroll {
            flex: 1 1 auto;
            min-height: 450px;
            width: 100%;

            overflow-x: hidden;
            overflow-y: auto;

            padding: 0 30px 24px;

            overscroll-behavior-y: contain;
            -webkit-overflow-scrolling: touch;
            scrollbar-width: thin;
            scrollbar-color: #e46033 rgba(255, 255, 255, 0.15);
        }

        #dashboard .dashboard-feedback-scroll::-webkit-scrollbar {
            width: 9px;
        }

        #dashboard .dashboard-feedback-scroll::-webkit-scrollbar-track {
            background: rgba(255, 255, 255, 0.12);
        }

        #dashboard .dashboard-feedback-scroll::-webkit-scrollbar-thumb {
            background: #e46033;
            border-radius: 10px;
        }

        #dashboard #pendingList {
            width: 100%;
            min-width: 0;
        }


        /* =====================================
           8. FEEDBACK CARDS
        ===================================== */

        /* Feedback card ki width chhoti karein */
        .admin-item {
            width: 85%;
            max-width: 850px;   
            margin: 16px auto;
            padding: 20px;
            box-sizing: border-box;

            background: #ffffff;
            color: #222222;
            border-radius: 10px;
            box-shadow: 0 3px 12px rgba(0, 0, 0, 0.15);
        }

        /* Feedback content ko ek line mein rakhein */
        .admin-item .feedback-content-row {
            display: flex;
            flex-direction: row;
            align-items: flex-start;
            gap: 10px;
            width: 100%;
        }

        /* Text ko available space dein */
        .admin-item .feedback-content {
            flex: 1;
            min-width: 0;
            overflow-wrap: anywhere;
        }

        .admin-actions {
            display: flex;
            flex-wrap: wrap;
            gap: 10px;
            margin-top: 15px;
        }

        .admin-actions button {
            padding: 10px 16px;
            border: none;
            border-radius: 6px;
            cursor: pointer;
        }

        .approve-btn {
            background: #147d45;
            color: #fff;
        }

        .reject-btn {
            background: #b42318;
            color: #fff;
        }

        button:disabled {
            opacity: 0.6;
            cursor: not-allowed;
        }


        /* =====================================
           9. INACTIVITY COUNTDOWN
        ===================================== */

        #inactivityRing {
            position: fixed;
            top: 110px;
            right: 20px;
            z-index: 9999;

            width: 80px;
            height: 80px;

            display: flex;
            align-items: center;
            justify-content: center;
        }

        #inactivityRing[hidden] {
            display: none !important;
        }

        #inactivityTimer {
            display: block;
            width: 80px;
            height: 80px;
        }

        .inactivity-ring-content {
            position: absolute;
            inset: 0;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            pointer-events: none;
        }

        #inactivityTime {
            color: #000;
            font-family: Arial, sans-serif;
            font-size: 14px;
            font-weight: 700;
        }

        .inactivity-ring-content small {
            margin-top: 3px;
            color: #000;
            font-family: Arial, sans-serif;
            font-size: 8px;
        }

    /* =====================================
    10. MOBILE RESPONSIVE
    ===================================== */

    @media (max-width: 650px) {

        #loginSection {
            width: calc(100% - 24px);
            max-width: 500px;
            height: auto;
            min-height: 600px;
            margin: 20px auto;
        }

        .curved-shape,
        .curved-shape2,
        .curved-shape3 {
            display: none;
        }

        .form-box {
            position: relative;
            width: 100%;
            height: auto;
            min-height: 370px;
            padding: 35px 25px 20px;
        }

        .form-box h2 {
            font-size: 27px;
            letter-spacing: 5px;
        }

        .info-content {
            position: relative;
            width: 100%;
            height: auto;
            padding: 15px 25px 10px;
            text-align: center;
        }

        .info-content h2 {
            font-size: 26px;
        }

        .info-content02 {
            position: relative;
            top: auto;
            width: 100%;
            height: auto;
            padding: 10px 25px 25px;
            text-align: center;
        }

        .info-content02 p {
            font-size: 13px;
        }

        /* Dashboard header */
        #dashboard .dashboard-fixed-header {
            padding: 16px 14px 10px;
        }

        #dashboard h1 {
            max-width: calc(100% - 5px);
            font-size: 23px;
            letter-spacing: 1px;
        }

        #dashboard h2 {
            margin: 16px 0 10px;
            font-size: 18px;
            letter-spacing: 3px;
        }

        /* One feedback card per row on mobile */
        #dashboard #pendingList {
            grid-template-columns: minmax(0, 1fr);
            column-gap: 0;
            row-gap: 10px;
        }

        #dashboard .dashboard-feedback-scroll {
            min-height: 0;
            padding: 0 12px 16px;
        }

        #dashboard .admin-item {
            padding: 14px;
        }

        #dashboard .admin-item img {
            width: 85px;
            height: 85px;
        }

        #dashboard .admin-item .feedback-content-row {
            gap: 12px;
        }

        /* Inactivity countdown */
        #inactivityRing {
            top: auto;
            right: 14px;
            bottom: 14px;
        }
    }

</style>
</head>
<body>

    <!-- =====================================
         ADMIN LOGIN
    ===================================== -->

    <main class="container" id="loginSection">

        <div class="curved-shape"></div>
        <div class="curved-shape3"></div>
        <div class="curved-shape2"></div>

        <section class="form-box Login">
            <h2 class="animation">Admin Login</h2>

            <form id="loginForm">
                <div class="input-box animation">
                    <input
                        id="adminEmail"
                        type="email"
                        placeholder=" "
                        autocomplete="username"
                        required
                    >
                    <label for="adminEmail">Admin Email</label>
                    <i class="bx bxs-user"></i>
                </div>

                <div class="input-box animation">
                    <input
                        id="adminPassword"
                        type="password"
                        placeholder=" "
                        autocomplete="current-password"
                        required
                    >
                    <label for="adminPassword">Password</label>
                    <i class="bx bxs-lock-alt"></i>
                </div>

                <div class="input-box animation">
                    <button class="btn" id="loginBtn" type="submit">
                        Login...
                    </button>
                </div>

                <button
                    class="forgot-btn"
                    id="forgotPasswordBtn"
                    type="button"
                >
                    Forgot Password ?
                </button>
            </form>

            <p id="loginStatus" role="status" aria-live="polite"></p>
        </section>

        <section class="info-content Login">
            <h2 class="animation">WELCOME BACK !</h2>
        </section>

        <section class="info-content02 Login">
            <p class="animation">
                Welcome to the Feedback Administrator Panel.
                Review submitted feedback, approve the entries
                you want to publish, and manage your feedback
                dashboard securely.
            </p>
        </section>

    </main>


    <!-- =====================================
         ADMIN DASHBOARD
    ===================================== -->

    <section class="admin-panel" id="dashboard" hidden>

        <!-- FIXED HEADER: DOES NOT SCROLL -->
        <div class="dashboard-fixed-header">

            <h1>Feedback Administrator Panel</h1>

            <button id="logoutBtn" type="button">
                Logout
            </button>

            <h2>Pending Feedback</h2>

            <p id="adminStatus" role="status" aria-live="polite"></p>

        </div>

        <!-- ONLY THIS AREA SCROLLS -->
        <div class="dashboard-feedback-scroll">
            <div id="pendingList"></div>
        </div>

    </section>


    <!-- KEEP YOUR EXISTING FIREBASE MODULE -->
    <script type="module" src="./admin.js"></script>


    <!-- INACTIVITY COUNTDOWN RING -->
    <div
        id="inactivityRing"
        hidden
        aria-label="Inactivity countdown"
    >
        <svg
            id="inactivityTimer"
            viewBox="0 0 100 100"
            width="80"
            height="80"
            aria-hidden="true"
        >
            <path id="inactivityFill" fill="#16a34a"></path>
        </svg>

        <div class="inactivity-ring-content">
            <span id="inactivityTime">00:00</span>
            <small>Auto Logout</small>
        </div>
    </div>

</body>
</html>
