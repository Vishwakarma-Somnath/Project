<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <!-- Favicon -->
    <link href="images/name-logo04 copy.png" rel="icon">

    <title>Admin Panel | Feedback Management</title>

    <!-- Boxicons -->
    <link
        href="https://unpkg.com/boxicons@2.1.4/css/boxicons.min.css"
        rel="stylesheet"
    >

    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'algerian',normal, sans-serif;
        }

        body{
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            background: #25252b;
        }

        /* LOGIN CONTAINER */
        .container {
            position: relative;
            width: 850px;
            max-width: calc(100% - 32px);
            height: 450px;
            margin: 45px auto;
            border: 2px solid #e46033;
            box-shadow: 0 0 25px #e46033;
            overflow: hidden;
            border-radius: 10px;
        }

        /* CURVED SHAPES */
        .curved-shape {
            position: absolute;
            top: -5px;
            right: 0;
            width: 850px;
            height: 600px;
            background: linear-gradient(45deg, #000000, #e46033);
            transform: rotate(10deg) skewY(40deg);
            transform-origin: bottom right;
            transition: 1.5s ease;
        }

        .curved-shape2 {
            position: absolute;
            top: 100%;
            left: 250px;
            width: 850px;
            height: 700px;
            background: #000000;
            border-top: 3px solid #e46033;
            transform: rotate(0deg) skewY(0deg);
            transform-origin: bottom left;
        }

        /* LOGIN FORM AREA */
        .form-box {
            position: absolute;
            top: 0;
            left: 0;
            width: 50%;
            height: 105%;
            display: flex;
            flex-direction: column;
            justify-content: center;
            padding: 35px 40px;
            z-index: 2;
        }

        .form-box h2 {
            font-size: 32px;
            color: #ffffff;
            text-align: center;            
        }

        #loginForm {
            width: 100%;
        }

        .input-box {
            position: relative;
            width: 100%;
            height: 50px;
            margin: 25px 0;
        }

        .input-box input {
            width: 100%;
            height: 100%;
            background: transparent;
            border: none;
            outline: none;
            border-bottom: 2px solid #fff;
            color: #fff;
            font-size: 16px;
            padding-right: 35px;
        }

        .btn::before{
            content: "";
            position: absolute;
            height: 100%;
            width: 100%;
            background: linear-gradient(#25252b, #e46033, #25252b, #e46033);
            top: -100%;
            left: 0;
            z-index: -1;
            transition: .5s;
        }

        .input-box input:focus,
        .input-box input:valid {
            border-bottom-color: #e46033;
        }

        .input-box label {
            position: absolute;
            top: 50%;
            left: 0;
            transform: translateY(-50%);
            font-size: 15px;
            color: #c9d5df;
            pointer-events: none;
            transition: 0.3s;
        }

        .input-box input:focus ~ label,
        .input-box input:valid ~ label {
            top: -5px;
            color: #e46033;
            font-size: 12px;
        }

        .input-box i {
            position: absolute;
            top: 50%;
            right: 0;
            transform: translateY(-50%);
            font-size: 20px;
            color: #c9d5df;
        }

        /* BUTTONS */
        .btn{
            position: relative;
            width: 100%;
            height: 45px;
            background: transparent;
            border-radius: 40px;
            cursor: pointer;
            font-size: 16px;
            font-weight: 600;
            border: 2px solid #e46033;
            overflow: hidden;
            z-index: 1;    
        }

            .btn::before{
            content: "";
            position: absolute;
            height: 300%;
            width: 100%;
            background: linear-gradient(#25252b, #e46033, #25252b, #e46033);
            top: -100%;
            left: 0;
            z-index: -1;
            transition: .5s;
        }


        .btn:hover::before {
            top: 0;
        }


        .forgot-btn {
            display: block;
            margin: 10px auto 0;
            padding: 8px;
            background: transparent;
            border: none;
            color: #55c8ef;
            font-size: 20px;
            cursor: pointer;
        }

        .forgot-btn:hover {
            text-decoration: underline;
        }

        /* LOGIN STATUS */
        #loginStatus {
            margin-top: 15px;
            font-size: 13px;
            line-height: 1.5;
            overflow-wrap: anywhere;
            text-align: center;
        }

        /* WELCOME AREA */
        .info-content {
            position: absolute;
            top: 0;
            right: 0;
            width: 70%;
            height: 30%;
            display: flex;
            flex-direction: column;
            justify-content: center;
            padding: 35px;
            text-align: right;
            z-index: 2;
        }
		
        .info-content h2 {
            font-size: 44px;
            color: #ffffff;
            line-height: 1.3;
            text-transform: uppercase;
        }

        /* SIMPLE ENTRY ANIMATION */
        .animation {
            animation: fadeIn 0.8s ease forwards;
        }

        @keyframes fadeIn {
            from {
                opacity: 0;
                transform: translateY(15px);
            }

            to {
                opacity: 1;
                transform: translateY(0);
            }
        }
		
				        /* WELCOME BACK! */
        .info-content02 {
            position: absolute;
            top: 10%;
            right: 0;
            width: 35%;
            height: 70%;
            display: flex;
            flex-direction: column;
            justify-content: center;
            padding: 35px;
            text-align: right;
            z-index: 2;
        }	
		
		        .info-content02 p {
            font-size: 15px;
            line-height: 1.7;
            margin-top: 16px;
            color: #ffffff;
        }
				
        /* ADMIN DASHBOARD */
        .admin-panel {
            width: calc(100% - 40px);
            max-width: 1200px;
            margin: 30px auto;
            padding: 25px;
            background: url("https://i.postimg.cc/RFqSM2rc/bg.jpg");
            background-size: cover;
            background-position: center;
            border-radius: 12px;
        }

        .admin-panel h1 {
            color: #ffffff;
        }

        .admin-panel h2 {
            margin-bottom: 20px;
            word-spacing: 0.3mm;
            color: #ffffff;
        }

        #dashboard {
            color: #ffffff;
        }

        #logoutBtn {
            padding: 10px 18px;
            background: #b42318;
            color: #fff;
            border: none;
            border-radius: 6px;
            cursor: pointer;
            margin-bottom: 20px;
        }

        #adminStatus {
            margin: 12px 0;
            color: #f5e12e !important;
            overflow-wrap: anywhere;
        }

        .admin-item {
            padding: 20px;
            margin: 16px 0;
            background: #fff;
            color: #222;
            border-radius: 10px;
            overflow-wrap: anywhere;
            box-shadow: 0 3px 12px rgba(0, 0, 0, 0.07);
        }

        .admin-item img {
            width: 90px;
            height: 90px;
            object-fit: cover;
            border-radius: 50%;
        }

        .feedback-content-row {
            display: flex;
            align-items: flex-start;
            gap: 16px;
            flex-wrap: wrap;
        }

        .admin-actions {
            display: flex;
            flex-wrap: wrap;
            gap: 10px;
            margin-top: 15px;
        }

        .admin-actions button {
            padding: 10px 16px;
            border: 0;
            border-radius: 6px;
            cursor: pointer;
        }

        .approve-btn {
            background: #147d45;
            color: white;
        }

        .reject-btn {
            background: #b42318;
            color: white;
        }

        button:disabled {
            opacity: 0.6;
            cursor: not-allowed;
        }

        [hidden] {
            display: none !important;
        }

        /* Fix Admin Email and Password input text */
        #adminEmail,
        #adminPassword {
            color: #ffffff !important;
            background-color: transparent !important;
            caret-color: #e46033;
            -webkit-text-fill-color: #ffffff !important;
        }

        /* Fix Chrome autofill and pasted text background */
        #adminEmail:-webkit-autofill,
        #adminPassword:-webkit-autofill,
        #adminEmail:-webkit-autofill:hover,
        #adminPassword:-webkit-autofill:hover,
        #adminEmail:-webkit-autofill:focus,
        #adminPassword:-webkit-autofill:focus {
            -webkit-text-fill-color: #ffffff !important;
            -webkit-box-shadow: 0 0 0 1000px #25252b inset !important;
            caret-color: #e46033;
            transition: background-color 9999s ease-in-out 0s;
        }

        /* Keep input text visible while selecting */
        #adminEmail::selection,
        #adminPassword::selection {
            background: #e46033;
            color: #ffffff;
        }

        /* Inactivity Countdown Ring */
        .inactivity-ring {
            position: fixed;
            left: 80%;
            top: 110px;
            width: 105px;
            height: 105px;
            z-index: 9999;
            border-radius: 50%;
            background: #ffffff;
            box-shadow: 0 4px 18px rgba(0, 0, 0, 0.18);
        }

        .inactivity-ring[hidden] {
            display: none !important;
        }

        .inactivity-svg {
            width: 100%;
            height: 100%;
            transform: rotate(-90deg);
        }

        .ring-bg,
        .ring-progress {
            fill: none;
            stroke-width: 7;
        }

        .ring-bg {
            stroke: #e5e7eb;
        }

        .ring-progress {
            stroke: #16a34a;
            stroke-linecap: round;
            stroke-dasharray: 282.743;
            stroke-dashoffset: 0;
            transition: stroke-dashoffset 0.4s linear,stroke 0.3s ease;
        }

        .inactivity-ring-content {
            position: absolute;
            inset: 0;
            display: flex;
            align-items: center;
            justify-content: center;
            flex-direction: column;
            color: #111827;
            pointer-events: none;
        }

        #inactivityTime {
            font-size: 19px;
            font-weight: 700;
            font-family: Arial, sans-serif;
        }

        .inactivity-ring-content small {
            margin-top: 3px;
            font-size: 10px;
            font-family: Arial, sans-serif;
            color: #6b7280;
        }

        @media (max-width: 600px) {
            .inactivity-ring {
                width: 85px;
                height: 85px;
                right: 14px;
                bottom: 14px;
            }

            #inactivityTime {
                font-size: 16px;
            }

            .inactivity-ring-content small {
                font-size: 9px;
            }
        }

        /* MOBILE RESPONSIVE */
        @media (max-width: 650px) {
            .container {
                width: 100%;
                height: auto;
                min-height: 600px;
                margin: 20px auto;
            }

            .curved-shape,
            .curved-shape2 {
                display: none;
            }

            .form-box {
                position: relative;
                width: 100%;
                height: auto;
                min-height: 370px;
                padding: 35px 25px 20px;
            }

            .info-content {
                position: relative;
                width: 100%;
                height: auto;
                padding: 15px 25px 35px;
                text-align: center;
            }

            .info-content h2 {
                font-size: 26px;
            }

            .info-content p {
                font-size: 14px;
            }

            .form-box h2 {
                font-size: 27px;
            }

            .admin-panel {
                margin: 15px;               
                padding: 15px;
            }

            .feedback-content-row {
                gap: 12px;
            }

            .admin-item img {
                width: 85px;
                height: 85px;
            }

            
            /* Control login and dashboard visibility */
            #loginSection[hidden],
            #dashboard[hidden] {
                display: none !important;
            }

            /* Dashboard appearance */
            #dashboard {
                box-sizing: border-box;
                width: calc(100% - 30px);
                max-width: none;
                margin: 15px auto;
                padding: 15px;
                background: #f4f7fb;
                color: #17212b;
                border-radius: 12px;
            }

            #dashboard h1,
            #dashboard h2 {
                color: #17212b;
                visibility: visible;
            }

            #dashboard #adminStatus {
                overflow-wrap: anywhere;
            }

        }
    </style>
</head>
<body>
    <!-- LOGIN SECTION -->
    <main class="container" id="loginSection">
        
        <div class="curved-shape"></div>
        <div class="curved-shape2"></div> 

    <!-- LOGIN FORM -->
        <section class="form-box Login">
            <h2 class="animation">Admin Login</h2>
            <form id="loginForm">

                <div class="input-box animation">
                    <input
                        id="adminEmail"
                        type="email"
                        placeholder=" "
                        autocomplete="username"
                        required
                    >
                    <label for="adminEmail">Admin Email</label>
                    <i class="bx bxs-user"></i>
                </div>

                <div class="input-box animation">
                    <input
                        id="adminPassword"
                        type="password"
                        placeholder=" "
                        autocomplete="current-password"
                        required
                    >
                    <label for="adminPassword">Password</label>
                    <i class="bx bxs-lock-alt"></i>
                </div>

                <div class="input-box animation" style="--D:3; --S:24">
                    <button
                        class="btn"
                        id="loginBtn"
                        type="submit"
                    >
                        Login
                    </button>
                </div>

                <button
                    class="forgot-btn"
                    id="forgotPasswordBtn"
                    type="button"
                >
                    Forgot Password ?
                </button>

            </form>

            <p
                id="loginStatus"
                role="status"
                aria-live="polite"
            ></p>

        </section>

        <!-- WELCOME MESSAGE -->
        <section class="info-content Login">

            <h2 class="animation">WELCOME BACK !</h2>
		</section>
		<section class="info-content02 Login">
            <p class="animation">
                Welcome to the Feedback Administrator Panel.
                Review submitted feedback, approve the entries
                you want to publish, and manage your feedback
                dashboard securely.
            </p>

        </section>

    </main>

    <!-- ADMIN DASHBOARD -->
    <section class="admin-panel" id="dashboard" hidden>

        <h1>Feedback Administrator Panel</h1>

        <button id="logoutBtn" type="button">
            Logout
        </button>

        <h2>Pending Feedback</h2>

        <p
            id="adminStatus"
            role="status"
            aria-live="polite"
        ></p>

        <div id="pendingList"></div>

    </section>

    <!-- KEEP YOUR EXISTING FIREBASE MODULE -->
    <script type="module" src="./admin.js"></script>

    <!-- Inactivity Countdown Ring -->
<div id="inactivityRing" class="inactivity-ring" hidden>
    <svg class="inactivity-svg" viewBox="0 0 100 100">
        <circle class="ring-bg" cx="50" cy="50" r="45"></circle>
        <circle
            id="inactivityProgress"
            class="ring-progress"
            cx="50"
            cy="50"
            r="45">
        </circle>
    </svg>

    <div class="inactivity-ring-content">
        <span id="inactivityTime">00:00</span>
        <small>Auto Logout</small>
    </div>
</div>
</body>
</html>
