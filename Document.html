<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>My Folder Menu</title>

    <style>
        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            font-family: Arial, sans-serif;
            background: #f2f4f7;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
        }

        .container {
            width: 90%;
            max-width: 700px;
            text-align: center;
        }

        h1 {
            margin-bottom: 30px;
            color: #222;
        }

        .buttons {
            display: grid;
            grid-template-columns: repeat(2, 1fr);
            gap: 20px;
        }

        .folder-btn {
            padding: 25px 15px;
            border: none;
            border-radius: 12px;
            background: #2563eb;
            color: white;
            font-size: 18px;
            font-weight: bold;
            cursor: pointer;
            text-decoration: none;
            transition: 0.2s;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        .folder-btn:hover {
            background: #d81dcc;
            transform: translateY(-3px);
        }

        @media (max-width: 500px) {
            .buttons {
                grid-template-columns: 1fr;
            }
        }
    </style>
</head>

<body>

    <div class="container">

        <h1>My Latest Projects Documents </h1>

        <div class="buttons">

            <a class="folder-btn" href="Projects/CIMFR.pdf">
                📁 CIMFR (CENTRAL INSTITUTE OF MINING AND FUEL RESEARCH)
            </a>

            <a class="folder-btn" href="Projects/PESO_1.pdf">
                📁 PESO_1 (Petroleum and Explosives Safety Organisation)
            </a>

            <a class="folder-btn" href="Projects/PESO_2.pdf">
                📁 PESO_2 (Petroleum and Explosives Safety Organisation)
            </a>

            <a class="folder-btn" href="Projects/Cold_Flaring.pdf">
                📁 Cold_Flaring
            </a>

            <a class="folder-btn" href="Projects/Degasing_Unit.pdf">
                📁 Degasing_Unit
            </a>

            <a class="folder-btn" href="Projects/HYDRO TESTING.pdf">
                📁 HST (HYDRO TESTING UNIT)
            </a>

        </div>

    </div>

</body>
</html>
