
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">

<title>Mobile_Document_Viewer</title>

<link rel="stylesheet"
href="https://cdn.jsdelivr.net/npm/pdfjs-dist@4.10.38/web/pdf_viewer.css">

<style>
* {
    box-sizing: border-box;
}

html, body {
    width: 100%;
    height: 100%;
    margin: 0;
    overflow: hidden;
    font-family: Arial, sans-serif;
    background: #252525;
}

/* TOOLBAR */

#toolbar {
    height: 52px;
    width: 100%;
    background: #323232;
    color: white;
    display: flex;
    align-items: center;
    gap: 7px;
    padding: 0 10px;
    position: relative;
    z-index: 20;
}

.tool-btn {
    border: 0;
    background: transparent;
    color: white;
    cursor: pointer;
    font-size: 19px;
    min-width: 32px;
    height: 36px;
    border-radius: 4px;
    flex-shrink: 0;
}

.tool-btn:hover {
    background: #505050;
}

.tool-btn:disabled {
    opacity: .35;
    cursor: default;
}

#pageNumber {
    width: 42px;
    height: 27px;
    text-align: center;
    border: 0;
    background: #171717;
    color: white;
}

#pageCount {
    white-space: nowrap;
    font-size: 13px;
}

#zoomValue {
    min-width: 48px;
    text-align: center;
    font-size: 13px;
}

.toolbar-divider {
    width: 1px;
    height: 25px;
    background: #666;
    margin: 0 3px;
    flex-shrink: 0;
}

#documentTitle {
    margin-left: 8px;
    font-size: 14px;
    font-weight: bold;
    white-space: nowrap;
    overflow: hidden;
    text-overflow: ellipsis;
}

.toolbar-spacer {
    flex: 1;
}

/* MAIN LAYOUT */

#main {
    position: absolute;
    top: 52px;
    bottom: 0;
    left: 0;
    right: 0;
}

/* SIDEBAR */

#sidebar {
    position: absolute;
    top: 0;
    bottom: 0;
    left: 0;
    z-index: 15;
    width: 230px;
    min-width: 180px;
    background: #292929;
    overflow-y: auto;
    border-right: 1px solid #444;
    display: none;
    padding: 12px;
}

#sidebar.open {
    display: block;
}

#thumbnailContainer {
    position: relative;
    width: 100%;
}

/* PDF VIEWER CONTAINER */

#viewerContainer {
    position: absolute;
    top: 0;
    right: 0;
    bottom: 0;
    left: 0;
    width: 100%;
    height: 100%;
    overflow: auto;
    background: #525252;
    -webkit-overflow-scrolling: touch;
}

/* PDF VIEWER */

#viewer {
    position: relative;
    padding: 15px 0 30px;
}

/* STATUS */

#status {
    position: absolute;
    top: 52px;
    left: 0;
    right: 0;
    z-index: 30;
    padding: 8px;
    text-align: center;
    color: white;
    background: #252525;
    font-size: 13px;
}

#status:empty {
    display: none;
}

/* THUMBNAIL ACTIVE PAGE */

.thumbnail-item.active canvas {
    border: 2px solid #8ab4f8 !important;
}

/* MOBILE */

@media (max-width: 600px) {

    #toolbar {
        gap: 2px;
        padding: 0 4px;
        height: 48px;
    }

    #main {
        top: 48px;
    }

    #status {
        top: 48px;
    }

    .tool-btn {
        min-width: 27px;
        font-size: 16px;
    }

    #pageNumber {
        width: 32px;
    }

    #pageCount {
        font-size: 11px;
    }

    #zoomValue {
        min-width: 35px;
        font-size: 11px;
    }

    #documentTitle {
        display: none;
    }

    #sidebar {
        width: 180px;
    }
}

@media (max-width: 380px) {
    #toolbar {
        gap: 1px;
        padding: 0 2px;
    }

    .tool-btn {
        min-width: 24px;
        font-size: 14px;
    }

    .toolbar-divider {
        margin: 0 1px;
    }

    #zoomValue {
        min-width: 31px;
    }
}
</style>
</head>

<body>

<!-- TOOLBAR -->

<header id="toolbar">

    <button class="tool-btn" id="sidebarBtn"
            title="Show Thumbnails">☰</button>

    <span id="documentTitle">Project Document</span>

    <div class="toolbar-spacer"></div>

    <button class="tool-btn" id="prevBtn"
            title="Previous Page">▲</button>

    <input type="number" id="pageNumber"
           min="1" value="1">

    <span id="pageCount">/ 0</span>

    <button class="tool-btn" id="nextBtn"
            title="Next Page">▼</button>

    <div class="toolbar-divider"></div>

    <button class="tool-btn" id="zoomOut"
            title="Zoom Out">−</button>

    <span id="zoomValue">100%</span>

    <button class="tool-btn" id="zoomIn"
            title="Zoom In">+</button>

    <div class="toolbar-divider"></div>

    <button class="tool-btn" id="fitPage"
            title="Fit Page">▣</button>

    <button class="tool-btn" id="rotateBtn"
            title="Rotate">↻</button>

    <div class="toolbar-divider"></div>

    <!-- DOWNLOAD BUTTON -->

    <button class="tool-btn" id="downloadBtn"
            title="Download PDF" disabled>⬇</button>

    <!-- PRINT BUTTON -->

    <button class="tool-btn" id="printBtn"
            title="Print PDF" disabled>🖨</button>

</header>

<div id="status">Loading PDF document...</div>

<!-- MAIN -->

<div id="main">

    <aside id="sidebar">
        <div id="thumbnailContainer"></div>
    </aside>

    <div id="viewerContainer">
        <div id="viewer" class="pdfViewer"></div>
    </div>

</div>


<script type="module">

/* =====================================
   PDF.JS IMPORTS
===================================== */

import * as pdfjsLib from
"https://cdn.jsdelivr.net/npm/pdfjs-dist@4.10.38/build/pdf.mjs";

import {
    EventBus,
    PDFViewer,
    PDFLinkService
} from
"https://cdn.jsdelivr.net/npm/pdfjs-dist@4.10.38/web/pdf_viewer.mjs";

pdfjsLib.GlobalWorkerOptions.workerSrc =
"https://cdn.jsdelivr.net/npm/pdfjs-dist@4.10.38/build/pdf.worker.mjs";


/* =====================================
   ELEMENTS
===================================== */

const status = document.getElementById("status");

const viewerContainer =
document.getElementById("viewerContainer");

const viewerElement =
document.getElementById("viewer");

const sidebar =
document.getElementById("sidebar");

const thumbnailContainer =
document.getElementById("thumbnailContainer");

const pageNumber =
document.getElementById("pageNumber");

const pageCount =
document.getElementById("pageCount");

const zoomValue =
document.getElementById("zoomValue");

const prevBtn =
document.getElementById("prevBtn");

const nextBtn =
document.getElementById("nextBtn");

const downloadBtn =
document.getElementById("downloadBtn");

const printBtn =
document.getElementById("printBtn");


/* =====================================
   VARIABLES
===================================== */

let pdfDocument = null;
let pdfUrl = "";
let currentRotation = 0;
let downloadFilename = "Project-Document.pdf";


/* =====================================
   PDF.JS COMPONENTS
===================================== */

const eventBus = new EventBus();

const linkService = new PDFLinkService({
    eventBus
});

const pdfViewer = new PDFViewer({

    container: viewerContainer,
    viewer: viewerElement,
    eventBus: eventBus,
    linkService: linkService,
    textLayerMode: 1,
    removePageBorders: false

});

linkService.setViewer(pdfViewer);


/* =====================================
   PAGE EVENTS
===================================== */

eventBus.on("pagesinit", () => {

    pdfViewer.currentScaleValue = "page-width";

    status.textContent = "";

    updateControls();

});

eventBus.on("pagechanging", (event) => {

    pageNumber.value = event.pageNumber;

    updateControls();

    updateActiveThumbnail(event.pageNumber);

});

eventBus.on("scalechanging", (event) => {

    zoomValue.textContent =
        Math.round(event.scale * 100) + "%";

});


/* =====================================
   UPDATE CONTROLS
===================================== */

function updateControls() {

    if (!pdfDocument) return;

    const current = pdfViewer.currentPageNumber;

    pageNumber.value = current;

    pageCount.textContent =
        "/ " + pdfDocument.numPages;

    prevBtn.disabled = current <= 1;

    nextBtn.disabled =
        current >= pdfDocument.numPages;

}


/* =====================================
   ACTIVE THUMBNAIL
===================================== */

function updateActiveThumbnail(page) {

    document.querySelectorAll(".thumbnail-item")
        .forEach((item, index) => {

            item.classList.toggle(
                "active",
                index + 1 === page
            );

        });

}


/* =====================================
   CREATE PDF THUMBNAILS
===================================== */

async function createThumbnails() {

    if (!pdfDocument) return;

    thumbnailContainer.replaceChildren();

    for (let i = 1; i <= pdfDocument.numPages; i++) {

        const page = await pdfDocument.getPage(i);

        const originalViewport = page.getViewport({
            scale: 1
        });

        const scale = 145 / originalViewport.width;

        const viewport = page.getViewport({
            scale: scale
        });

        const canvas = document.createElement("canvas");

        const ratio = Math.min(
            window.devicePixelRatio || 1,
            2
        );

        canvas.width =
            Math.floor(viewport.width * ratio);

        canvas.height =
            Math.floor(viewport.height * ratio);

        canvas.style.width = viewport.width + "px";
        canvas.style.height = viewport.height + "px";

        const context = canvas.getContext("2d");

        await page.render({

            canvasContext: context,
            viewport: viewport,
            transform: [ratio, 0, 0, ratio, 0, 0]

        }).promise;

        const item = document.createElement("div");

        item.className = "thumbnail-item";

        item.style.width = "100%";
        item.style.marginBottom = "18px";
        item.style.textAlign = "center";
        item.style.cursor = "pointer";

        canvas.style.display = "block";
        canvas.style.margin = "0 auto";
        canvas.style.border = "2px solid transparent";
        canvas.style.boxShadow = "0 1px 5px #0008";

        const label = document.createElement("div");

        label.textContent = i;
        label.style.color = "white";
        label.style.fontSize = "12px";
        label.style.marginTop = "5px";

        item.appendChild(canvas);
        item.appendChild(label);

        item.addEventListener("click", () => {

            pdfViewer.currentPageNumber = i;

            if (window.innerWidth <= 600) {
                sidebar.classList.remove("open");
            }

        });

        thumbnailContainer.appendChild(item);

    }

    updateActiveThumbnail(pdfViewer.currentPageNumber);

}


/* =====================================
   LOAD PDF
===================================== */

async function startViewer() {

    try {

        if (!location.hash) {

            throw new Error(
                "PDF URL missing. Open the document from the portal."
            );

        }

        pdfUrl = decodeURIComponent(
            location.hash.substring(1)
        );

        const url = new URL(pdfUrl);

        if (

            url.protocol !== "https:" ||

            url.hostname !==
            "ypxffgqjrckojzzldczm.supabase.co" ||

            !url.pathname.startsWith(
                "/storage/v1/object/sign/project-documents/"
            )

        ) {

            throw new Error("Invalid PDF link.");

        }

        const encodedFilename =
            url.pathname.split("/").pop() || "";

        if (encodedFilename) {
            downloadFilename =
                decodeURIComponent(encodedFilename);

            if (!downloadFilename.toLowerCase().endsWith(".pdf")) {
                downloadFilename += ".pdf";
            }
        }

        status.textContent = "Loading PDF...";

        const loadingTask = pdfjsLib.getDocument({
            url: pdfUrl
        });

        pdfDocument = await loadingTask.promise;

        linkService.setDocument(pdfDocument);

        pdfViewer.setDocument(pdfDocument);

        await createThumbnails();

        pageCount.textContent =
            "/ " + pdfDocument.numPages;

        document.getElementById("documentTitle").textContent =
            downloadFilename;

        downloadBtn.disabled = false;
        printBtn.disabled = false;

        status.textContent = "";

    } catch (error) {

        console.error("PDF Loading Error:", error);

        status.textContent =
            "PDF Loading Error: " + error.message;

    }

}


/* =====================================
   PREVIOUS PAGE
===================================== */

prevBtn.addEventListener("click", () => {

    if (pdfDocument && pdfViewer.currentPageNumber > 1) {

        pdfViewer.currentPageNumber--;

    }

});


/* =====================================
   NEXT PAGE
===================================== */

nextBtn.addEventListener("click", () => {

    if (
        pdfDocument &&
        pdfViewer.currentPageNumber < pdfDocument.numPages
    ) {

        pdfViewer.currentPageNumber++;

    }

});


/* =====================================
   PAGE NUMBER INPUT
===================================== */

pageNumber.addEventListener("change", () => {

    if (!pdfDocument) return;

    let page = parseInt(pageNumber.value, 10);

    if (!Number.isFinite(page)) page = 1;

    page = Math.max(
        1,
        Math.min(page, pdfDocument.numPages)
    );

    pdfViewer.currentPageNumber = page;

});


/* =====================================
   ZOOM IN
===================================== */

document.getElementById("zoomIn")
.addEventListener("click", () => {

    pdfViewer.currentScale =
        Math.min(pdfViewer.currentScale * 1.2, 5);

});


/* =====================================
   ZOOM OUT
===================================== */

document.getElementById("zoomOut")
.addEventListener("click", () => {

    pdfViewer.currentScale =
        Math.max(pdfViewer.currentScale / 1.2, 0.25);

});


/* =====================================
   FIT PAGE
===================================== */

document.getElementById("fitPage")
.addEventListener("click", () => {

    pdfViewer.currentScaleValue = "page-fit";

});


/* =====================================
   ROTATE
===================================== */

document.getElementById("rotateBtn")
.addEventListener("click", () => {

    currentRotation =
        (currentRotation + 90) % 360;

    pdfViewer.pagesRotation = currentRotation;

});


/* =====================================
   THUMBNAIL SIDEBAR
===================================== */

document.getElementById("sidebarBtn")
.addEventListener("click", () => {

    sidebar.classList.toggle("open");

});


/* =====================================
   DOWNLOAD PDF
===================================== */

downloadBtn.addEventListener("click", async () => {

    if (!pdfUrl || !pdfDocument) return;

    try {

        downloadBtn.disabled = true;
        downloadBtn.textContent = "…";

        const response = await fetch(pdfUrl);

        if (!response.ok) {
            throw new Error(
                "Unable to download PDF. HTTP " + response.status
            );
        }

        const blob = await response.blob();

        const blobUrl = URL.createObjectURL(blob);

        const link = document.createElement("a");

        link.href = blobUrl;
        link.download = downloadFilename;

        document.body.appendChild(link);

        link.click();

        link.remove();

        setTimeout(() => {
            URL.revokeObjectURL(blobUrl);
        }, 60000);

    } catch (error) {

        console.error("Download Error:", error);

        status.textContent =
            "Download failed: " + error.message;

    } finally {

        downloadBtn.disabled = false;
        downloadBtn.textContent = "⬇";

    }

});


/* =====================================
   PRINT PDF
===================================== */

printBtn.addEventListener("click", async () => {

    if (!pdfUrl || !pdfDocument) return;

    let printWindow = null;
    let blobUrl = "";

    try {

        /*
          Open blank window immediately.
          This helps avoid popup blocking.
        */

        printWindow = window.open("", "_blank");

        if (!printWindow) {
            throw new Error(
                "Please allow pop-ups to print this PDF."
            );
        }

        printWindow.document.write(`
            <!DOCTYPE html>
            <html>
            <head>
                <title>Preparing PDF for Print</title>
                <style>
                    body {
                        font-family: Arial, sans-serif;
                        background: #222;
                        color: white;
                        display: flex;
                        justify-content: center;
                        align-items: center;
                        height: 100vh;
                        margin: 0;
                    }
                </style>
            </head>
            <body>
                Preparing PDF for printing...
            </body>
            </html>
        `);

        const response = await fetch(pdfUrl);

        if (!response.ok) {
            throw new Error(
                "Unable to load PDF for printing."
            );
        }

        const blob = await response.blob();

        blobUrl = URL.createObjectURL(blob);

        printWindow.location.href = blobUrl;

        /*
          PDF browser viewer loads the blob.
          User can then use its Print control.
        */

        status.textContent =
            "PDF opened in a new tab. Use the Print option there.";

        setTimeout(() => {

            if (blobUrl) {
                URL.revokeObjectURL(blobUrl);
            }

        }, 10 * 60 * 1000);

    } catch (error) {

        console.error("Print Error:", error);

        if (printWindow && !printWindow.closed) {
            printWindow.close();
        }

        status.textContent =
            "Print failed: " + error.message;

    }

});


/* =====================================
   MOBILE SIDEBAR CLOSE
===================================== */

viewerContainer.addEventListener("click", () => {

    if (
        window.innerWidth <= 600 &&
        sidebar.classList.contains("open")
    ) {

        sidebar.classList.remove("open");

    }

});


/* =====================================
   START VIEWER
===================================== */

startViewer();

</script>

</body>
</html>
