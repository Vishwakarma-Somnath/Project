
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">

<title>HPCL Project Document Viewer</title>

<link rel="stylesheet"
href="https://cdn.jsdelivr.net/npm/pdfjs-dist@4.10.38/web/pdf_viewer.css">

<style>
* {
    box-sizing: border-box;
}

html, body {
    width: 100%;
    height: 100%;
    margin: 0;
    overflow: hidden;
    font-family: Arial, sans-serif;
    background: #252525;
}

/* TOOLBAR */

#toolbar {
    height: 52px;
    width: 100%;
    background: #323232;
    color: white;

    display: flex;
    align-items: center;
    gap: 7px;
    padding: 0 10px;

    position: relative;
    z-index: 20;
}

.tool-btn {
    border: 0;
    background: transparent;
    color: white;
    cursor: pointer;
    font-size: 19px;
    min-width: 32px;
    height: 36px;
    border-radius: 4px;
}

.tool-btn:hover {
    background: #505050;
}

.tool-btn:disabled {
    opacity: .35;
    cursor: default;
}

#pageNumber {
    width: 42px;
    height: 27px;
    text-align: center;
    border: 0;
    background: #171717;
    color: white;
}

#pageCount {
    white-space: nowrap;
    font-size: 13px;
}

#zoomValue {
    min-width: 48px;
    text-align: center;
    font-size: 13px;
}

.toolbar-divider {
    width: 1px;
    height: 25px;
    background: #666;
    margin: 0 3px;
}

#documentTitle {
    margin-left: 8px;
    font-size: 14px;
    font-weight: bold;
    white-space: nowrap;
    overflow: hidden;
    text-overflow: ellipsis;
}

/* MAIN LAYOUT */

#main {
    position: absolute;
    top: 52px;
    bottom: 0;
    left: 0;
    right: 0;
    display: flex;
}

/* SIDEBAR */

#sidebar {
    width: 230px;
    min-width: 180px;
    background: #292929;
    overflow-y: auto;
    border-right: 1px solid #444;
    display: none;
    padding: 12px;
}

#sidebar.open {
    display: block;
}

#thumbnailContainer {
    position: relative;
    width: 100%;
}

#thumbnailContainer .thumbnail {
    margin: 0 auto 15px;
}

/* PDF VIEWER */

#viewerContainer {
    flex: 1;
    position: relative;
    overflow: auto;
    background: #525252;
    -webkit-overflow-scrolling: touch;
}

#viewer {
    padding: 15px 0 30px;
}

/* STATUS */

#status {
    position: absolute;
    top: 52px;
    left: 0;
    right: 0;
    z-index: 30;
    padding: 8px;
    text-align: center;
    color: white;
    background: #252525;
    font-size: 13px;
}

#status:empty {
    display: none;
}

/* MOBILE */

@media (max-width: 600px) {

    #toolbar {
        gap: 2px;
        padding: 0 4px;
        height: 48px;
    }

    #main {
        top: 48px;
    }

    #status {
        top: 48px;
    }

    .tool-btn {
        min-width: 29px;
        font-size: 16px;
    }

    #pageNumber {
        width: 34px;
    }

    #pageCount {
        font-size: 11px;
    }

    #zoomValue {
        min-width: 40px;
        font-size: 11px;
    }

    #documentTitle {
        display: none;
    }

    #sidebar {
        position: absolute;
        top: 0;
        bottom: 0;
        left: 0;
        z-index: 15;
        width: 180px;
    }
}
</style>
</head>

<body>

<!-- TOOLBAR -->

<header id="toolbar">

    <button class="tool-btn" id="sidebarBtn"
            title="Show Thumbnails">☰</button>

    <span id="documentTitle">Project Document</span>

    <div style="flex:1"></div>

    <button class="tool-btn" id="prevBtn"
            title="Previous Page">▲</button>

    <input type="number" id="pageNumber"
           min="1" value="1">

    <span id="pageCount">/ 0</span>

    <button class="tool-btn" id="nextBtn"
            title="Next Page">▼</button>

    <div class="toolbar-divider"></div>

    <button class="tool-btn" id="zoomOut"
            title="Zoom Out">−</button>

    <span id="zoomValue">100%</span>

    <button class="tool-btn" id="zoomIn"
            title="Zoom In">+</button>

    <div class="toolbar-divider"></div>

    <button class="tool-btn" id="fitPage"
            title="Fit Page">▣</button>

    <button class="tool-btn" id="rotateBtn"
            title="Rotate">↻</button>

</header>

<div id="status">Loading PDF document...</div>

<!-- MAIN -->

<div id="main">

    <!-- THUMBNAILS -->

    <aside id="sidebar">
        <div id="thumbnailContainer"></div>
    </aside>

    <!-- PDF PAGES -->

    <div id="viewerContainer">
        <div id="viewer" class="pdfViewer"></div>
    </div>

</div>


<script type="module">

/* =====================================
   PDF.JS IMPORTS
===================================== */

import * as pdfjsLib from
"https://cdn.jsdelivr.net/npm/pdfjs-dist@4.10.38/build/pdf.mjs";

import {
    EventBus,
    PDFViewer,
    PDFLinkService,
    PDFThumbnailViewer
} from
"https://cdn.jsdelivr.net/npm/pdfjs-dist@4.10.38/web/pdf_viewer.mjs";


pdfjsLib.GlobalWorkerOptions.workerSrc =
"https://cdn.jsdelivr.net/npm/pdfjs-dist@4.10.38/build/pdf.worker.mjs";


/* =====================================
   ELEMENTS
===================================== */

const status = document.getElementById("status");

const viewerContainer =
document.getElementById("viewerContainer");

const viewerElement =
document.getElementById("viewer");

const sidebar =
document.getElementById("sidebar");

const thumbnailContainer =
document.getElementById("thumbnailContainer");

const pageNumber =
document.getElementById("pageNumber");

const pageCount =
document.getElementById("pageCount");

const zoomValue =
document.getElementById("zoomValue");

const prevBtn =
document.getElementById("prevBtn");

const nextBtn =
document.getElementById("nextBtn");


/* =====================================
   VARIABLES
===================================== */

let pdfDocument = null;
let pdfUrl = "";

let currentRotation = 0;


/* =====================================
   PDF.JS COMPONENTS
===================================== */

const eventBus = new EventBus();

const linkService = new PDFLinkService({
    eventBus
});

const pdfViewer = new PDFViewer({

    container: viewerContainer,

    viewer: viewerElement,

    eventBus: eventBus,

    linkService: linkService,

    textLayerMode: 1,

    removePageBorders: false

});

linkService.setViewer(pdfViewer);


const pdfThumbnailViewer = new PDFThumbnailViewer({

    container: thumbnailContainer,

    eventBus: eventBus,

    linkService: linkService

});


/* =====================================
   PAGE EVENTS
===================================== */

eventBus.on("pagesinit", () => {

    pdfViewer.currentScaleValue = "page-width";

    status.textContent = "";

    updateControls();

});


eventBus.on("pagechanging", (event) => {

    pageNumber.value = event.pageNumber;

    updateControls();

});


eventBus.on("scalechanging", (event) => {

    zoomValue.textContent =
        Math.round(event.scale * 100) + "%";

});


/* =====================================
   UPDATE CONTROLS
===================================== */

function updateControls() {

    if (!pdfDocument) return;

    pageNumber.value = pdfViewer.currentPageNumber;

    pageCount.textContent =
        "/ " + pdfDocument.numPages;

    prevBtn.disabled =
        pdfViewer.currentPageNumber <= 1;

    nextBtn.disabled =
        pdfViewer.currentPageNumber >= pdfDocument.numPages;

}


/* =====================================
   LOAD PDF
===================================== */

async function startViewer() {

    try {

        if (!location.hash) {

            throw new Error(
                "PDF URL missing. Open the document from the portal."
            );

        }

        pdfUrl = decodeURIComponent(
            location.hash.substring(1)
        );

        const url = new URL(pdfUrl);

        if (

            url.protocol !== "https:" ||

            url.hostname !==
            "ypxffgqjrckojzzldczm.supabase.co" ||

            !url.pathname.startsWith(
                "/storage/v1/object/sign/project-documents/"
            )

        ) {

            throw new Error("Invalid PDF link.");

        }

        status.textContent = "Loading PDF...";

        const loadingTask = pdfjsLib.getDocument({

            url: pdfUrl

        });

        pdfDocument = await loadingTask.promise;

        linkService.setDocument(pdfDocument);

        pdfViewer.setDocument(pdfDocument);

        pdfThumbnailViewer.setDocument(pdfDocument);

        pageCount.textContent =
            "/ " + pdfDocument.numPages;

        document.getElementById("documentTitle").textContent =
            "Project Document";

    } catch (error) {

        console.error(error);

        status.textContent =
            "PDF Loading Error: " + error.message;

    }

}


/* =====================================
   PREVIOUS PAGE
===================================== */

prevBtn.addEventListener("click", () => {

    if (pdfDocument && pdfViewer.currentPageNumber > 1) {

        pdfViewer.currentPageNumber--;

    }

});


/* =====================================
   NEXT PAGE
===================================== */

nextBtn.addEventListener("click", () => {

    if (
        pdfDocument &&
        pdfViewer.currentPageNumber < pdfDocument.numPages
    ) {

        pdfViewer.currentPageNumber++;

    }

});


/* =====================================
   PAGE NUMBER INPUT
===================================== */

pageNumber.addEventListener("change", () => {

    if (!pdfDocument) return;

    let page = parseInt(pageNumber.value, 10);

    if (!Number.isFinite(page)) page = 1;

    page = Math.max(
        1,
        Math.min(page, pdfDocument.numPages)
    );

    pdfViewer.currentPageNumber = page;

});


/* =====================================
   ZOOM IN
===================================== */

document.getElementById("zoomIn")
.addEventListener("click", () => {

    pdfViewer.currentScale =
        Math.min(pdfViewer.currentScale * 1.2, 5);

});


/* =====================================
   ZOOM OUT
===================================== */

document.getElementById("zoomOut")
.addEventListener("click", () => {

    pdfViewer.currentScale =
        Math.max(pdfViewer.currentScale / 1.2, 0.25);

});


/* =====================================
   FIT PAGE
===================================== */

document.getElementById("fitPage")
.addEventListener("click", () => {

    pdfViewer.currentScaleValue = "page-fit";

});


/* =====================================
   ROTATE
===================================== */

document.getElementById("rotateBtn")
.addEventListener("click", () => {

    currentRotation =
        (currentRotation + 90) % 360;

    pdfViewer.pagesRotation = currentRotation;

});


/* =====================================
   THUMBNAIL SIDEBAR
===================================== */

document.getElementById("sidebarBtn")
.addEventListener("click", () => {

    sidebar.classList.toggle("open");

});


/* =====================================
   MOBILE SIDEBAR CLOSE
===================================== */

viewerContainer.addEventListener("click", () => {

    if (
        window.innerWidth <= 600 &&
        sidebar.classList.contains("open")
    ) {

        sidebar.classList.remove("open");

    }

});


/* =====================================
   START VIEWER
===================================== */

startViewer();

</script>

</body>
</html>
