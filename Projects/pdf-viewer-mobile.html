
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">

    <title>Mobile PDF Viewer</title>

    <!-- Official PDF.js Text Layer CSS -->
    <link rel="stylesheet"
          href="https://cdn.jsdelivr.net/npm/pdfjs-dist@4.10.38/web/pdf_viewer.css">

    <style>
        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            background: #25252b;
            color: white;
            font-family: Arial, sans-serif;
            overflow-x: hidden;
        }

        header {
            position: sticky;
            top: 0;
            z-index: 10;
            background: #17171b;
            padding: 10px;
            border-bottom: 1px solid #444;
        }

        .toolbar {
            display: flex;
            align-items: center;
            justify-content: center;
            flex-wrap: wrap;
            gap: 8px;
        }

        button {
            padding: 10px 14px;
            border: none;
            border-radius: 7px;
            background: #2563eb;
            color: white;
            font-size: 14px;
            font-weight: bold;
            cursor: pointer;
        }

        button:disabled {
            opacity: 0.4;
            cursor: not-allowed;
        }

        #downloadBtn {
            background: #15803d;
        }

        #pageInfo {
            min-width: 100px;
            text-align: center;
            font-size: 14px;
            white-space: nowrap;
        }

        #status {
            padding: 10px;
            text-align: center;
            color: #cbd5e1;
            font-size: 14px;
        }

        #pages {
            width: 100%;
            min-height: calc(100vh - 60px);
            padding: 8px 0 25px;
            display: flex;
            flex-direction: column;
            align-items: center;
            overflow: auto;
        }

        /* PDF PAGE */
        .pdf-page {
            position: relative;
            flex: 0 0 auto;
            margin: 0 auto 15px;
            background: white;
            box-shadow: 0 2px 12px #0008;
        }

        /* PDF CANVAS */
        .pdf-page canvas {
            position: absolute;
            top: 0;
            left: 0;
            display: block;
            z-index: 1;
        }

        /* TEXT LAYER */
        .pdf-page .textLayer {
            position: absolute;
            inset: 0;
            z-index: 2;

            overflow: hidden;
            line-height: 1;
            text-align: initial;

            user-select: text;
            -webkit-user-select: text;
            -webkit-touch-callout: default;

            cursor: text;
            pointer-events: auto;
        }

        /* Selection Highlight */
        .pdf-page .textLayer ::selection {
            background: rgba(0, 120, 215, 0.45);
            color: transparent;
        }

        @media (max-width: 480px) {
            header {
                padding: 8px 4px;
            }

            .toolbar {
                gap: 6px;
            }

            button {
                padding: 9px 10px;
                font-size: 12px;
            }

            #pageInfo {
                min-width: 85px;
                font-size: 12px;
            }
        }
    </style>
</head>

<body>

<header>
    <div class="toolbar">

        <button id="prev" disabled>Previous</button>

        <span id="pageInfo">Loading PDF...</span>

        <button id="next" disabled>Next</button>

        <button id="downloadBtn" disabled>Download</button>

    </div>
</header>

<div id="status">Loading PDF document...</div>

<main id="pages"></main>

<script type="module">

import * as pdfjsLib from
    "https://cdn.jsdelivr.net/npm/pdfjs-dist@4.10.38/build/pdf.min.mjs";

pdfjsLib.GlobalWorkerOptions.workerSrc =
    "https://cdn.jsdelivr.net/npm/pdfjs-dist@4.10.38/build/pdf.worker.min.mjs";


/* =====================================
   ELEMENTS
===================================== */

const status = document.getElementById("status");
const pages = document.getElementById("pages");
const pageInfo = document.getElementById("pageInfo");

const prev = document.getElementById("prev");
const next = document.getElementById("next");
const downloadBtn = document.getElementById("downloadBtn");


/* =====================================
   VARIABLES
===================================== */

let pdf = null;
let pdfUrl = "";
let currentPage = 1;
let renderId = 0;


function showError(message) {

    status.textContent = message;
    status.style.color = "#ff9999";

}


/* =====================================
   RENDER PDF PAGE
===================================== */

async function renderPage() {

    if (!pdf) return;

    const thisRender = ++renderId;

    try {

        const page = await pdf.getPage(currentPage);

        if (thisRender !== renderId) return;


        /* Original PDF dimensions */

        const original = page.getViewport({
            scale: 1
        });


        /* Fit PDF to available width */

        const availableWidth =
            Math.max(pages.clientWidth - 16, 200);

        const scale = Math.min(
            availableWidth / original.width,
            3
        );

        const viewport = page.getViewport({
            scale: scale
        });


        /* =====================================
           CREATE PAGE WRAPPER
        ===================================== */

        pages.replaceChildren();

        const wrapper = document.createElement("div");

        wrapper.className = "pdf-page";

        wrapper.style.width = viewport.width + "px";
        wrapper.style.height = viewport.height + "px";

        /* PDF.js scale variable */

        wrapper.style.setProperty(
            "--scale-factor",
            viewport.scale
        );


        /* =====================================
           CREATE CANVAS
        ===================================== */

        const canvas = document.createElement("canvas");

        const context = canvas.getContext("2d");

        const ratio = Math.min(
            window.devicePixelRatio || 1,
            2
        );

        canvas.width = Math.floor(
            viewport.width * ratio
        );

        canvas.height = Math.floor(
            viewport.height * ratio
        );

        canvas.style.width = viewport.width + "px";
        canvas.style.height = viewport.height + "px";

        wrapper.appendChild(canvas);

        pages.appendChild(wrapper);


        /* =====================================
           RENDER PDF PAGE
        ===================================== */

        await page.render({

            canvasContext: context,

            viewport: viewport,

            transform: [
                ratio, 0,
                0, ratio,
                0, 0
            ]

        }).promise;

        if (thisRender !== renderId) return;


        /* =====================================
           GET REAL PDF TEXT
        ===================================== */

        const textContent = await page.getTextContent();

        if (thisRender !== renderId) return;

        console.log(
            "PDF Text Items:",
            textContent.items.length
        );


        /* =====================================
           CREATE TEXT LAYER
        ===================================== */

        const textLayerDiv = document.createElement("div");

        textLayerDiv.className = "textLayer";

        textLayerDiv.style.width = viewport.width + "px";
        textLayerDiv.style.height = viewport.height + "px";

        wrapper.appendChild(textLayerDiv);


        /* =====================================
           PDF.JS TEXT LAYER RENDERING
        ===================================== */

        if (!pdfjsLib.TextLayer) {

            throw new Error(
                "PDF.js TextLayer is not available."
            );

        }

        const textLayer = new pdfjsLib.TextLayer({

            textContentSource: textContent,

            container: textLayerDiv,

            viewport: viewport

        });

        await textLayer.render();

        if (thisRender !== renderId) return;


        /* =====================================
           UPDATE CONTROLS
        ===================================== */

        status.textContent = "";

        pageInfo.textContent =
            `Page ${currentPage} / ${pdf.numPages}`;

        prev.disabled = currentPage <= 1;

        next.disabled = currentPage >= pdf.numPages;

        pages.scrollTop = 0;
        pages.scrollLeft = 0;

    } catch (error) {

        if (thisRender === renderId) {

            showError(
                "Page Render Error: " + error.message
            );

        }

        console.error(error);

    }

}


/* =====================================
   LOAD PDF
===================================== */

async function startViewer() {

    try {

        if (!location.hash) {

            throw new Error(
                "PDF URL missing. Please open the document from the portal."
            );

        }

        pdfUrl = decodeURIComponent(
            location.hash.substring(1)
        );

        const url = new URL(pdfUrl);

        if (
            url.protocol !== "https:" ||

            url.hostname !==
                "ypxffgqjrckojzzldczm.supabase.co" ||

            !url.pathname.startsWith(
                "/storage/v1/object/sign/project-documents/"
            )

        ) {

            throw new Error("Invalid PDF link.");

        }

        status.textContent = "Loading PDF...";

        const task = pdfjsLib.getDocument({
            url: pdfUrl
        });

        pdf = await task.promise;

        downloadBtn.disabled = false;

        await renderPage();

    } catch (error) {

        console.error(
            "Mobile PDF Viewer Error:",
            error
        );

        showError(
            "PDF Loading Error: " +
            (error.message || "Unknown error")
        );

    }

}


/* =====================================
   PREVIOUS PAGE
===================================== */

prev.addEventListener("click", async () => {

    if (pdf && currentPage > 1) {

        currentPage--;

        await renderPage();

    }

});


/* =====================================
   NEXT PAGE
===================================== */

next.addEventListener("click", async () => {

    if (pdf && currentPage < pdf.numPages) {

        currentPage++;

        await renderPage();

    }

});


/* =====================================
   DOWNLOAD PDF
===================================== */

downloadBtn.addEventListener("click", async () => {

    if (!pdfUrl) return;

    try {

        downloadBtn.disabled = true;

        downloadBtn.textContent = "Downloading...";

        const response = await fetch(pdfUrl);

        if (!response.ok) {

            throw new Error("Unable to download PDF.");

        }

        const blob = await response.blob();

        const blobUrl = URL.createObjectURL(blob);

        const link = document.createElement("a");

        link.href = blobUrl;

        link.download = "Project-Document.pdf";

        document.body.appendChild(link);

        link.click();

        link.remove();

        setTimeout(() => {

            URL.revokeObjectURL(blobUrl);

        }, 60000);

    } catch (error) {

        console.error("Download Error:", error);

        showError(
            "Download failed. Please check the signed URL or storage CORS settings."
        );

    } finally {

        downloadBtn.disabled = false;

        downloadBtn.textContent = "Download";

    }

});


/* =====================================
   RESIZE HANDLING
===================================== */

let resizeTimer;

window.addEventListener("resize", () => {

    if (!pdf) return;

    clearTimeout(resizeTimer);

    resizeTimer = setTimeout(() => {

        renderPage();

    }, 200);

});


/* =====================================
   START VIEWER
===================================== */

startViewer();

</script>

</body>
</html>
