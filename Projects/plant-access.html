
<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Plant Document Verification</title>
  <link rel="icon" type="image/png" href="/Project/Projects/icon.png">

  <style>
    * { box-sizing: border-box; }

    
    body {
      margin: 0;
      min-height: 100vh;
      background: #080808;
      color: #fff;
      font-family: "Segoe UI", Arial, sans-serif;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 24px;
    }

    main {
      width: min(900px, 100%);
      background: transparent;
      border: none;
      border-radius: 0;
      padding: 0;
    }

    h1 {
      color: #67e8f9;
      text-align: center;
      font-size: clamp(25px, 4vw, 38px);
      overflow-wrap: anywhere;
    }

    .intro { color: #cbd5e1; text-align: center; }

    label {
      display: block;
      margin: 18px 0 7px;
      color: #cbd5e1;
    }

    input {
      width: 100%;
      padding: 14px;
      border-radius: 9px;
      border: 1px solid #555;
      background: #090909;
      color: #fff;
      font-size: 16px;
    }

    button {
      margin-top: 16px;
      padding: 14px 20px;
      width: 100%;
      border: 0;
      border-radius: 9px;
      background: #2563eb;
      color: #fff;
      font-weight: 700;
      font-size: 16px;
      cursor: pointer;
    }

    button:disabled { opacity: .6; cursor: wait; }

    #message, #loginStatus {
      margin-top: 16px;
      line-height: 1.6;
      overflow-wrap: anywhere;
    }

    .docs { display: grid; gap: 10px; margin-top: 18px; }

    .docs a {
      display: block;
      padding: 13px;
      background: #1d4ed8;
      color: white;
      text-decoration: none;
      border-radius: 8px;
      overflow-wrap: anywhere;
    }

    .back {
      display: block;
      margin-top: 24px;
      color: #93c5fd;
      text-align: center;
    }

    .plantListStatus {
      text-align: center;
    }

    .selectbtn {
      display:grid;
      grid-template-columns:repeat(auto-fit,minmax(210px,1fr));
      gap:16px;
      margin-top:28px
    }
    
    /* Plant location: no box container */
    #plantSelection {
      width: 100%;
      margin-top: 20px;
      padding: 0;
      background: transparent;
      align-items: center;
      justify-content: center;
      border: none;
      border-radius: 0;
      box-shadow: none;
    }

    /* Login form: separate box container */
    #loginSection {
      width: min(400px, 100%);
      margin-top: 20px;
      padding: 24px;
      background: #1b1b1b;
      border: 1px solid #3a3a3a;
      border-top: 3px solid #2563eb;
      border-radius: 14px;
      box-shadow: 0 8px 25px rgba(0, 0, 0, 0.3);
    }

    /* Plant location buttons */
    #plantLocationButtons {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(210px, 1fr));
      gap: 16px;
      margin-top: 20px;
    }

    #plantLocationButtons button {
      margin-top: 0;
    }

    [hidden] {
      display: none !important;
    }

    @media (max-width: 500px) {
      #loginSection {
        padding: 16px;
      }

      #plantLocationButtons {
        grid-template-columns: 1fr;
      }
    }

  </style>
</head>

<body>
<main>
  <h1 id="heading">Plant Document Portal</h1>

  <p class="intro" id="plantInfo">
    Sign in with the username and password provided by your administrator.
  </p>
      
  <section id="plantSelection" hidden>
    <p class="intro">Select your plant or location.</p>

    <div id="plantLocationButtons" class="selectbtn"></div>

    <p class="plantListStatus"
      id="plantListStatus"
      role="status"
      aria-live="polite"></p>
  </section>

  <section id="loginSection" hidden>
    <form id="portalLoginForm">
      <label for="portalUsername">Username</label>
      <input id="portalUsername" type="text"
        autocomplete="username" minlength="3" maxlength="40" required>

      <label for="portalPassword">Password</label>
      <input id="portalPassword" type="password"
        autocomplete="current-password" required>

      <button id="loginButton" type="submit">
        Login &amp; View Documents
      </button>
    </form>

    <p id="loginStatus" role="status" aria-live="polite"></p>
    <div id="documents" class="docs"></div>
  </section>

  <a class="back" id="backLink" href="../Documents.html">← Back</a>
</main>

<script src="plant-access.js"></script>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

<script>
(async () => {
  "use strict";

  const SUPABASE_URL =
    "https://ypxffgqjrckojzzldczm.supabase.co";

  const SUPABASE_ANON_KEY =
    "sb_publishable_nFp00HnajqG5_C2XJJlR8Q_iMe-5hKh";

  const BUCKET = "project-documents";

  

const params = new URLSearchParams(location.search);
const companyParam = params.get("company") || "";
const plantParam = params.get("plant") || "";
const companyKey = companyParam.trim().toUpperCase();

const normalize = value =>
  String(value || "").trim().toLowerCase();

let plant = null;
let plantLookupError = "";

const heading = document.getElementById("heading");
const plantInfo = document.getElementById("plantInfo");
const form = document.getElementById("portalLoginForm");
const status = document.getElementById("loginStatus");
const documents = document.getElementById("documents");
const backLink = document.getElementById("backLink");

const plantSelection = document.getElementById("plantSelection");
const plantLocationButtons =
  document.getElementById("plantLocationButtons");
const plantListStatus = document.getElementById("plantListStatus");
const loginSection = document.getElementById("loginSection");

form.hidden = true;
loginSection.hidden = true;
documents.replaceChildren();

backLink.href = "/Project/Documents.html";

if (!["BPCL", "HPCL", "IOCL"].includes(companyKey)) {
  heading.textContent = "Invalid Company";
  plantInfo.textContent =
    "Please return to Documents and select a valid company.";
  plantListStatus.textContent = "";
  plantSelection.hidden = true;
  return;
}

heading.textContent = `${companyKey} — Plant Selection`;

async function loadPlants() {
  plantSelection.hidden = false;
  plantInfo.textContent = "";
  plantListStatus.textContent = "Loading plant locations...";

  try {
    const response = await fetch(
      `${SUPABASE_URL}/functions/v1/list-public-plants`,
      {
        method: "POST",
        headers: {
          "Content-Type": "application/json",
          "apikey": SUPABASE_ANON_KEY,
          "Authorization": `Bearer ${SUPABASE_ANON_KEY}`
        },
        body: JSON.stringify({ company: companyKey })
      }
    );

    const result = await response.json();

    if (!response.ok || result.success !== true) {
      throw new Error(
        result.error || `Plant service returned HTTP ${response.status}`
      );
    }

    const plants = (result.plants || []).filter(item =>
      normalize(item.company) === normalize(companyKey) &&
      item.is_active !== false &&
      item.location_name &&
      item.location_slug
    );

    plantLocationButtons.replaceChildren();

    if (!plants.length) {
      plantListStatus.textContent =
        `No active locations were returned for ${companyKey}. ` +
        "Check the project_portal_plants table and list-public-plants function.";
      return;
    }

    for (const item of plants) {
      const button = document.createElement("button");
      button.type = "button";
      button.textContent = "📍 " + item.location_name;

      button.addEventListener("click", () => {
        const nextUrl = new URL(window.location.href);
        nextUrl.searchParams.set("company", companyKey);
        nextUrl.searchParams.set("plant", item.location_slug);
        window.location.assign(nextUrl.href);
      });

      plantLocationButtons.appendChild(button);
    }

    plantListStatus.textContent =
      "Choose your assigned plant or location.";
  } catch (error) {
    console.error("Plant list loading failed:", error);
    plantListStatus.textContent =
      "Could not load locations. Please check the plant-list service configuration.";
  }
}

if (!plantParam) {
  await loadPlants();
  return;
}

try {
  if (!/^[a-z0-9-]+$/i.test(plantParam)) {
    throw new Error("Invalid plant slug in URL.");
  }

  const response = await fetch(
    `${SUPABASE_URL}/functions/v1/list-public-plants`,
    {
      method: "POST",
      headers: {
        "Content-Type": "application/json",
        "apikey": SUPABASE_ANON_KEY,
        "Authorization": `Bearer ${SUPABASE_ANON_KEY}`
      },
      body: JSON.stringify({ company: companyKey })
    }
  );

  const result = await response.json();

  if (!response.ok || result.success !== true) {
    throw new Error(
      result.error || `Plant service returned HTTP ${response.status}`
    );
  }

  const match = (result.plants || []).find(item =>
    normalize(item.company) === normalize(companyKey) &&
    normalize(item.location_slug) === normalize(plantParam) &&
    item.is_active !== false
  );

  if (!match) {
    throw new Error(
      `Plant '${plantParam}' was not found in the active ${companyKey} locations.`
    );
  }

  plant = {
    name: match.location_name,
    company: normalize(match.company),
    location: normalize(match.location_slug),
    enabled: true,
    projectUrl:
      "https://vishwakarma-somnath.github.io/Project/Projects/" +
      encodeURIComponent(companyKey) + "/" +
      encodeURIComponent(match.location_name) + "/" +
      encodeURIComponent(match.location_name) + ".html",
    documentFolder:
      normalize(match.company) + "/" +
      normalize(match.location_slug)
  };
} catch (error) {
  console.error("Plant lookup failed:", error);
  plantLookupError = error.message || "Unable to load plant information.";
}

heading.textContent = plant
  ? `${companyKey} — ${plant.name}`
  : "Plant Not Found";

plantSelection.hidden = true;

if (!plant) {
  form.hidden = true;
  plantInfo.textContent = plantLookupError;
  return;
}

form.hidden = false;
loginSection.hidden = false;
plantInfo.textContent = "";

  const usernameInput = document.getElementById("portalUsername");
  const passwordInput = document.getElementById("portalPassword");
  const loginButton = document.getElementById("loginButton");

  heading.textContent = plant
    ? `${companyKey} — ${plant.name}`
    : "Plant Not Found";

    if (!plant || plant.enabled === false) {
    form.hidden = true;

    plantInfo.textContent = window.plantLookupError
        ? "Could not load plant details. Please try again later."
        : "Plant not found or inactive. Check the company and plant URL.";

    return;
}

  plantInfo.textContent =
    `Sign in to access ${plant.name} documents.`;

  if (!window.supabase?.createClient) {
    form.hidden = true;
    status.textContent = "Supabase client library failed to load.";
    return;
  }

  const supabase = window.supabase.createClient(
    SUPABASE_URL,
    SUPABASE_ANON_KEY,
    {
      auth: {
        persistSession: true,
        autoRefreshToken: true,
        detectSessionInUrl: false
      }
    }
  );

  let busy = false;

  function showStatus(message) {
    status.textContent = message;
  }

  function getErrorMessage(error, data) {
    if (data?.error) return data.error;

    const context = error?.context;
    if (context?.json) {
      return context.json()
        .then(body => body?.error || error.message || "Request failed.")
        .catch(() => error.message || "Request failed.");
    }

    return Promise.resolve(
      error?.message || "Request failed. Check the portal configuration."
    );
  }

  async function showPrivateDocuments() {
    documents.replaceChildren();

    // Folder names must match the actual Storage folder structure.
    const folder = `${plant.company}/${plant.location}`;

    showStatus("Loading authorized documents...");

    const { data: files, error } = await supabase.storage
      .from(BUCKET)
      .list(folder, {
        limit: 100,
        sortBy: { column: "name", order: "asc" }
      });

    if (error) throw error;

    const pdfs = (files || []).filter(file =>
      file.name.toLowerCase().endsWith(".pdf")
    );

    if (!pdfs.length) {
      showStatus("No PDF documents are available for this plant yet.");
      return;
    }

    for (const file of pdfs) {
      const path = `${folder}/${file.name}`;

      const { data, error: urlError } = await supabase.storage
        .from(BUCKET)
        .createSignedUrl(path, 60);

      if (urlError || !data?.signedUrl) {
        console.error("Signed URL creation failed:", urlError);
        continue;
      }

      const link = document.createElement("a");
      link.href = data.signedUrl;
      link.target = "_blank";
      link.rel = "noopener noreferrer";
      link.textContent = file.name;
      documents.appendChild(link);
    }

    showStatus(
      documents.childElementCount
        ? "Login successful. Your documents are listed below."
        : "Could not create document links. Check Storage RLS policies."
    );
  }

  form.addEventListener("submit", async event => {
    event.preventDefault();
    if (busy) return;

    busy = true;
    loginButton.disabled = true;
    documents.replaceChildren();

    const username = usernameInput.value.trim();
    const password = passwordInput.value;

    showStatus("Verifying your account...");

    try {
      const { data, error } = await supabase.functions.invoke(
        "username-login",
        { body: { username, password } }
      );

      // Log useful diagnostic details, never the password or tokens.
      console.log("Portal login response:", {
        success: data?.success,
        username: data?.user?.username,
        error: data?.error || error?.message || null
      });

      if (error || !data?.success) {
        const message = await getErrorMessage(error, data);
        throw new Error(message);
      }

      // The Edge Function returns session tokens inside data.session.
      const accessToken = data.session?.access_token;
      const refreshToken = data.session?.refresh_token;

      if (!accessToken || !refreshToken || !data.user?.id) {
        throw new Error(
          "Login response is incomplete. Check the username-login Edge Function response."
        );
      }

      // Company/location must be supplied by the trusted server response.
      // Do not trust URL parameters as proof of authorization.
      if (!data.user.company || !data.user.location) {
        throw new Error(
          "The login service did not return the assigned company and plant. Update username-login before continuing."
        );
      }

      if (
        normalize(data.user.company) !== normalize(plant.company) ||
        normalize(data.user.location) !== normalize(plant.location)
      ) {
        throw new Error("This account is not assigned to this plant.");
      }

      const { error: sessionError } = await supabase.auth.setSession({
        access_token: accessToken,
        refresh_token: refreshToken
      });

      if (sessionError) throw sessionError;

      showStatus("Login successful. Opening project...");
      window.location.assign(plant.projectUrl);
      return;

      await showPrivateDocuments();

    } catch (error) {
      console.error("Portal login error:", error);
      documents.replaceChildren();

      showStatus(error.message || "Login failed. Please try again.");
    } finally {
      busy = false;
      loginButton.disabled = false;
    }
  });
})();
</script>
</body>
</html>
