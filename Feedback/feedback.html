<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Feedback | Somnath</title>
  <link rel="stylesheet" href="feedback.css">
</head>
<body>
  <main class="feedback-container">
    <section class="feedback-form-card">
      <h1>Share Your Feedback</h1>
      <p>Your feedback is valuable to me.</p>

      <form id="feedbackForm">
        <label for="name">Full Name</label>
        <input id="name" name="name" type="text"
               maxlength="80" required>

        <label for="email">Email Address (Private)</label>
        <input id="email" name="email" type="email"
               maxlength="254" required>

        <label for="designation">Designation</label>
        <input id="designation" name="designation" type="text"
               maxlength="100" placeholder="e.g. Engineer, Student"
               required>

        <label for="message">Your Feedback</label>
        <textarea id="message" name="message" rows="5"
                  maxlength="1500" required></textarea>

        <label for="photo">Your Photo (JPG, PNG, WebP — Max 2 MB)</label>
        <input id="photo" name="photo" type="file"
               accept=".jpg,.jpeg,.png,.webp,image/jpeg,image/png,image/webp"
               required>

        <p id="formStatus" role="status" aria-live="polite"></p>
        <button id="submitBtn" type="submit">Submit Feedback</button>
      </form>

      <p class="privacy-note">
        Your feedback will appear publicly only after admin approval.
        Your email address will remain private.
      </p>
    </section>

    <section class="public-feedback">
      <h2>Feedback from Visitors</h2>
      <p>Approved feedback only.</p>
      <div id="feedbackList" class="feedback-grid">
        <p>Loading feedback...</p>
      </div>
    </section>
  </main>

  <script type="module" src="feedback.js"></script>
</body>
</html>
